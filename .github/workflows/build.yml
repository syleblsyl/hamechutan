# Builds, tests and signs the APK on every push to main.
# When version.properties has a version that has no release yet, a release "v<version>" with the APK is
# published in the PUBLIC downloads repository (RELEASES_REPO) — the source code repository is private.
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD (signing key), RELEASES_TOKEN (write access to RELEASES_REPO).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TOOLCHAIN: ${{ github.workspace }}/../tc
      RELEASES_REPO: syleblsyl/hamechutan-releases
    steps:
      - uses: actions/checkout@v5

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../tc
          key: toolchain-v1-${{ hashFiles('tools/setup-toolchain.sh') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain
        run: ./tools/ci-step.sh "Toolchain" ./tools/setup-toolchain.sh

      - name: Unit tests
        run: ./tools/ci-step.sh "Unit tests" ./tools/run-tests.sh

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Only used to diagnose a common mistake (values added under "Variables" instead of "Secrets").
          VAR_B64_SET: ${{ vars.KEYSTORE_BASE64 != '' }}
          VAR_PASS_SET: ${{ vars.KEYSTORE_PASSWORD != '' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "secret KEYSTORE_BASE64: ${#KEYSTORE_BASE64} chars, secret KEYSTORE_PASSWORD: ${#KEYSTORE_PASSWORD} chars"
            echo "variable KEYSTORE_BASE64 set: $VAR_B64_SET, variable KEYSTORE_PASSWORD set: $VAR_PASS_SET"
            if [ "$VAR_B64_SET" = "true" ] || [ "$VAR_PASS_SET" = "true" ]; then
              echo "::error title=Signing key::The values were added as Actions *Variables*. Delete them and add them as Actions *Secrets* (Settings > Secrets and variables > Actions > Secrets tab)."
            else
              echo "::error title=Signing key::Repository secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD not found (b64=${#KEYSTORE_BASE64}, pass=${#KEYSTORE_PASSWORD} chars). Add them under Settings > Secrets and variables > Actions > Secrets > New repository secret (not Codespaces/Dependabot/Environment)."
            fi
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          printf '%s' "$KEYSTORE_PASSWORD" > signing/password.txt

      - name: Build signed APK
        env:
          REQUIRE_SIGNING_KEY: "true"
          REQUIRE_LICENSE: "true"
        run: ./tools/ci-step.sh "Build" ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaMechutan-apk
          path: build/outputs/*.apk

      - name: Publish release for a new version
        if: github.ref == 'refs/heads/main'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OWN_TOKEN: ${{ github.token }}
        run: |
          # Until the public downloads repository is set up (secret RELEASES_TOKEN), publish here.
          # The app checks both repositories for updates.
          if [ -n "$RELEASES_TOKEN" ]; then export GH_TOKEN="$RELEASES_TOKEN"; REPO="$RELEASES_REPO"
          else echo "::warning title=Releases::RELEASES_TOKEN not set; publishing in $GITHUB_REPOSITORY"; export GH_TOKEN="$OWN_TOKEN"; REPO="$GITHUB_REPOSITORY"; fi
          V=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if gh release view "v$V" -R "$REPO" >/dev/null 2>&1; then
            echo "Release v$V already exists in $REPO — bump version.properties to publish a new one."
            exit 0
          fi
          awk -v v="$V" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "גרסה $V" > notes.md
          ./tools/ci-step.sh "Publish" gh release create "v$V" "build/outputs/HaMechutan-$V.apk" -R "$REPO" \
            --title "המחותן $V" --notes-file notes.md

      - name: Remove signing key
        if: always()
        run: rm -rf signing
