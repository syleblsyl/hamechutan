# Builds, tests and signs the APK on every push to main.
# When version.properties has a version that has no GitHub Release yet, a release "v<version>"
# is created with the APK attached — that is how the app is updated on the phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TOOLCHAIN: ${{ github.workspace }}/../tc
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../tc
          key: toolchain-v1-${{ hashFiles('tools/setup-toolchain.sh') }}

      - name: Install toolchain
        run: ./tools/setup-toolchain.sh

      - name: Unit tests
        run: ./tools/run-tests.sh

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD are not set (see README)."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          printf '%s' "$KEYSTORE_PASSWORD" > signing/password.txt

      - name: Build signed APK
        env:
          REQUIRE_SIGNING_KEY: "true"
        run: ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaMechutan-apk
          path: build/outputs/*.apk

      - name: Publish release for a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists — bump version.properties to publish a new one."
            exit 0
          fi
          awk -v v="$V" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "גרסה $V" > notes.md
          gh release create "v$V" "build/outputs/HaMechutan-$V.apk" --title "המחותן $V" --notes-file notes.md

      - name: Remove signing key
        if: always()
        run: rm -rf signing
